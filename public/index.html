<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devilcrush Login</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #34205f, #120f1d 52%, #09080d); color: #f6f3ff; padding: 24px; }
    main { width: min(560px, 100%); background: rgba(25, 20, 39, .92); border: 1px solid rgba(255,255,255,.12); border-radius: 22px; padding: 32px; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { color: #bcb4d1; line-height: 1.55; }
    label { display: block; margin: 24px 0 8px; font-weight: 650; }
    input, button { width: 100%; border-radius: 12px; font: inherit; padding: 13px 15px; }
    input { color: #fff; background: #100d18; border: 1px solid #4b3e65; }
    button { margin-top: 14px; cursor: pointer; color: #fff; background: linear-gradient(135deg, #8b5cf6, #6d28d9); border: 0; font-weight: 700; }
    button:disabled { cursor: wait; opacity: .65; }
    .card { margin-top: 24px; padding: 20px; background: #100d18; border-radius: 16px; text-align: center; }
    .code { min-height: 48px; margin: 12px 0; font-size: 30px; letter-spacing: 5px; font-weight: 800; color: #c4b5fd; }
    .status { margin: 0; font-size: 14px; }
    .ok { color: #86efac; }
    .error { color: #fda4af; }
    small { color: #8e86a5; }
  </style>
</head>
<body>
  <main>
    <h1>Devilcrush</h1>
    <p>Connect a WhatsApp account with a pairing code. Enter the phone number in international format without the plus sign, for example <strong>15551234567</strong>.</p>
    <form id="login-form">
      <label for="numero">WhatsApp phone number</label>
      <input id="numero" name="numero" inputmode="numeric" autocomplete="tel" placeholder="15551234567" pattern="[0-9]+" required>
      <button id="submit" type="submit">Generate login code</button>
    </form>
    <section class="card" aria-live="polite">
      <small>Pairing code</small>
      <div id="code" class="code">—</div>
      <p id="status" class="status">Enter a number to begin.</p>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('login-form');
    const numberInput = document.getElementById('numero');
    const submit = document.getElementById('submit');
    const code = document.getElementById('code');
    const status = document.getElementById('status');
    let activeNumber = '';

    function setStatus(message, className = '') {
      status.textContent = message;
      status.className = `status ${className}`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const numero = numberInput.value.replace(/[^0-9]/g, '');
      if (!numero) return setStatus('Enter a valid phone number.', 'error');
      activeNumber = numero;
      code.textContent = '…';
      submit.disabled = true;
      setStatus('Requesting a pairing code…');
      socket.emit('connect:numero', { numero });
    });

    socket.on('pairing:code', ({ numero, code: pairingCode }) => {
      if (numero !== activeNumber) return;
      code.textContent = pairingCode || 'Unavailable';
      setStatus('On your phone, open WhatsApp → Linked devices → Link a device, then enter this code.', 'ok');
      submit.disabled = false;
    });

    socket.on('session:connected', ({ numero, name }) => {
      if (numero !== activeNumber) return;
      code.textContent = '✓';
      setStatus(`Connected${name ? ` as ${name}` : ''}.`, 'ok');
      submit.disabled = false;
    });

    socket.on('error', ({ message }) => {
      code.textContent = '—';
      setStatus(message || 'Unable to create the session.', 'error');
      submit.disabled = false;
    });
  </script>
</body>
</html>
